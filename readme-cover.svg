<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="t d">
<title id="t">Wolf-Notes — deduction deserves a record</title>
<desc id="d">Original midnight-blue vector cover depicting a moon, an evidence notebook, connected statements, and round-by-round deduction cards. This is conceptual artwork, not a game screenshot.</desc>
<defs>
