</defs>
<rect width="1500" height="470" fill="url(#bg)"/><rect width="1500" height="470" fill="url(#stars)"/>
<circle cx="1358" cy="90" r="55" fill="url(#moon)" opacity=".75"/><circle cx="1385" cy="72" r="53" fill="#222E46"/>
